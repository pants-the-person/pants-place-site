name: Sync personal sites

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [personal-site-updated]

permissions:
  contents: write

concurrency:
  group: sync-personal-sites
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Update site submodules
        run: npm run sites:sync

      - name: Regenerate site metadata
        run: npm run sites:metadata

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sites/member sites/char src/generated/personal-sites.ts

          if git diff --cached --quiet; then
            echo "Personal sites are already up to date."
            exit 0
          fi

          git commit -m "Update personal site submodules"
          git push origin HEAD:main
